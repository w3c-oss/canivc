<div class="card-box">
  <div class="card-head">
    <h2>{{ listTitle }}</h2>
    {%- if tooltip -%}
    <span class="info" tabindex="0" data-tooltip="{{ tooltip }}" aria-label="{{ tooltip }}">i</span>
    {%- endif -%}
  </div>
  <ul class="score-list">
    {%- for item in itemList limit:limit -%}
    <li class="score-item">
      <div class="score-name">
        <a href="/implementations/{{ item.text | slugify }}">{{ item.text }}</a><span class="count">{{ item.passed }} / {{ item.total }}</span>
      </div>
      {% BarRating item '100%' %}
    </li>
    {%- endfor -%}
  </ul>
  {%- if buttonText -%}
  <a class="button" href="{{ buttonLink }}">{{ buttonText }}</a>
  {%- endif -%}
</div>
