<div class="card-box">
  <div class="result-meta" v-html="store.resultText"></div>
  <div v-for="result in store.searchResults.slice(0, store.paginationNumber)" class="result">
    <a :href="result.url" v-html="result.meta.title"></a>
    <div
      v-if="result.sub_results.length"
      class="excerpt"
      v-html="result.sub_results[0].excerpt"
    ></div>
  </div>
  <div
    v-if="store.paginationNumber < store.searchResults.length"
    class="center"
    style="margin-top: 1.25rem"
  >
    <button class="button wide" @click="store.showMoreResults">
      Show More Results
    </button>
  </div>
</div>
